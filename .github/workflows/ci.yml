name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Upgrade npm
        run: |
          corepack enable
          corepack prepare npm@11 --activate

      - run: npm ci

      - run: npm run build

      - run: npm test
