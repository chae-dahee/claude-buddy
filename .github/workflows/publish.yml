name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Remove setup-node generated .npmrc
        run: rm -f .npmrc

      - run: npm publish --access public --provenance
